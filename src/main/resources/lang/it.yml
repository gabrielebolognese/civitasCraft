rules:
  title: "<gold>Regole del server"
  author: "CivitasCraft"
  page-welcome: "<dark_gray><bold>CivitasCraft\n\n<black>Costruisci una citta. Coltiva, commercia, rivendica terre e combatti guerre in cui non puoi perdere cio che hai costruito.\n\n<dark_gray>Ogni regola qui esiste perche ha sorpreso qualcuno."
  page-cities: "<dark_gray><bold>Citta\n\n<black>Puoi appartenere a una sola citta. Chi ne esce non puo entrare in un'altra per un giorno, cosi una guerra non si vince assoldando l'avversario.\n\nI gradi decidono cosa puoi fare. Chiedi al tuo sindaco."
  page-land: "<dark_gray><bold>Terra\n\n<black>Una rivendicazione protegge un chunk. La terra che non hai rivendicato non e tua, <bold>anche se ci hai costruito<reset><black>.\n\nQualcuno puo rivendicare il terreno sotto la tua costruzione e non e un furto. Prima rivendica, poi costruisci."
  page-money: "<dark_gray><bold>Denaro\n\n<black>Tenere la terra costa denaro, ogni giorno. Una citta che smette di giocare si prosciuga e perde i chunk esterni.\n\nNulla guadagna mentre dormi. Vendere al mercato ne abbassa il prezzo, quindi diversifica."
  page-war: "<dark_gray><bold>Guerra\n\n<black>Le guerre si dichiarano, si preparano e si combattono in una finestra fissa.\n\n<bold>Ogni blocco distrutto in guerra viene rimesso a posto.<reset><black> Brucialo, allagalo, fallo saltare: alla fine il mondo torna esattamente com'era. Cio che rischi e denaro e reputazione."
  page-loot: "<dark_gray><bold>L'unica eccezione\n\n<black>I blocchi tornano. <bold>Gli oggetti presi a mano da una cassa no.<reset><black>\n\nDistruggere un deposito quindi non serve a nulla, saccheggiarlo serve moltissimo.\n\nMetti nel caveau cio che non puoi perdere prima di una guerra. Il caveau non e saccheggiabile."
  page-conduct: "<dark_gray><bold>Condotta\n\n<black>Gli account secondari non guadagnano nulla e non contano nulla.\n\nOgni moneta che si muove e registrata e un amministratore puo leggerla.\n\n<dark_gray>/report <player> <reason>"

civitas:
  about-header: "<dark_gray>--- <gold>CivitasCraft<dark_gray> ---"
  about-version: "<gray>Versione <white><version>"
  about-help: "<gray>Comandi: <white>/city help"
  about-rules: "<gray>Regole del server: <white>/civitas rules"

# I prefissi dei messaggi, SPEC 23.3. I token della palette (<dim>, <money>, <city>...) sono
# definiti nel codice da Palette, quindi cambiare un colore non richiede di toccare un messaggio.
prefixes:
  economy: "<dim>[</dim><money>$</money><dim>]</dim> "
  city: "<dim>[</dim><city>Città</city><dim>]</dim> "
  land: "<dim>[</dim><land>Terra</land><dim>]</dim> "
  war: "<dim>[</dim><war>Guerra</war><dim>]</dim> "
  quest: "<dim>[</dim><quest>Missione</quest><dim>]</dim> "
  ally: "<dim>[</dim><ally>Diplomazia</ally><dim>]</dim> "
  server: "<dim>[</dim><ally>Server</ally><dim>]</dim> "
  admin: "<dim>[</dim><admin>Admin</admin><dim>]</dim> "
  error: "<dim>[</dim><neg>!</neg><dim>]</dim> "
  success: "<dim>[</dim><pos>+</pos><dim>]</dim> "
  # Modalità compatta, SPEC 23.3: un carattere invece di una parola.
  compact-economy: "<money>$</money> "
  compact-city: "<city>C</city> "
  compact-land: "<land>L</land> "
  compact-war: "<war>W</war> "
  compact-quest: "<quest>Q</quest> "
  compact-ally: "<ally>D</ally> "
  compact-server: "<ally>S</ally> "
  compact-admin: "<admin>A</admin> "
  compact-error: "<neg>!</neg> "
  compact-success: "<pos>+</pos> "

