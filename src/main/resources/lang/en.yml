  arrived: "<green>Welcome to <white><destination></white>."
  cancelled-moved: "<red>Teleport cancelled: you moved."
  cancelled-damage: "<red>Teleport cancelled: you took damage."
  already-warming: "<red>You are already travelling."
  combat-tagged: "<red>You cannot teleport while in combat. <gray>Walk away instead."
