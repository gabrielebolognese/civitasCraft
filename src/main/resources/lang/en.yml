# CivitasCraft, English messages.
# All player-facing text lives here. Never hardcode a string in Java.
# Formatting is MiniMessage. Legacy colour codes are not supported.
#
# Placeholders are MiniMessage tags, e.g. <command>, and are supplied by the
# caller. An unknown tag renders literally rather than throwing.

prefix: "<dark_gray>[<gold>Civitas<dark_gray>] <gray>"

general:
  missing-message: "<red>Missing message: <key>"

plugin:
  enabled: "<green>CivitasCraft <version> enabled."
  disabled: "<gray>CivitasCraft disabled."
  starting: "<gray>CivitasCraft is still starting up. Try again in a moment."
  reloaded: "<green>Configuration reloaded."

command:
  not-implemented: "<yellow>/<command> is not implemented yet. It arrives in milestone <milestone>."
  player-only: "<red>That command can only be used by a player."
  no-permission: "<red>You do not have permission to use that."
  error: "<red>Something went wrong. The details are in the server console."

player:
  unknown: "<red>No player named <white><player></white> has ever joined this server."

economy:
  no-account: "<red>You have no account yet. Rejoin the server and try again."
  frozen: "<red>Your account is frozen. Contact an administrator."
  insufficient-funds: "<red>You need <white><required> C</white> but only have <white><balance> C</white>. You are <white><short> C</white> short."
  amount-not-positive: "<red>The amount must be greater than zero."
  max-balance: "<red>That would take the balance over the server limit of <white><max> C</white>."
  amount-invalid: "<red>That is not a valid amount. Use plain numbers, like <white>1500</white> or <white>1500.50</white>."
  pay-self: "<red>You cannot pay yourself."
  balance-self: "<gray>Balance: <white><amount>"
  balance-other: "<gray><player>'s balance: <white><amount>"
  pay-sent: "<green>Paid <white><amount></white> to <white><player></white>. You now have <white><balance></white>."
  pay-received: "<green><player> paid you <white><amount></white>."
  upkeep:
    failed: "<red>Your city could not pay its <white><amount> C</white> upkeep. Land will be sold if this continues."
    grace: "<yellow>Your city owes upkeep. Land will start being sold in <white><days></white> days."
    land-sold: "<red><count></red> <red>chunks were sold to cover unpaid upkeep."
    nothing-to-sell: "<red>Your city owes upkeep and has no land left to sell. Only the core remains."
    debt-cleared: "<green>The land sale covered your city's upkeep. The debt is settled."

city:
  none: "<gray>You are not in a city. Use <white>/city create <name></white> to found one."
  unknown: "<red>No city by that name."
  frozen: "<red>This city is frozen by an administrator and cannot be changed."
  not-a-member: "<red>That player is not a member of this city."
  no-permission: "<red>Your rank does not have the <white><permission></white> permission."

  create:
    already-in-city: "<red>You are already in a city. Leave it before founding another."
    name-invalid: "<red>That name contains characters that are not allowed."
    name-length: "<red>A city name must be between <white><min></white> and <white><max></white> characters."
    name-blocked: "<red>That name is reserved."
    name-taken: "<red>A city called <white><name></white> already exists."
    playtime: "<red>You need <white><required></white> hours of playtime to found a city. You have <white><have></white>."
    disband-cooldown: "<red>You disbanded a city recently. You may found another in <white><hours></white> hours."
    chunk-claimed: "<red>This chunk already belongs to a city."
    too-close: "<red>You are too close to another city. Move at least <white><chunks></white> chunks away."
    world-blocked: "<red>Cities cannot be founded in this world."
    world-disabled: "<red>This world is not enabled for cities."
    cancelled: "<red>City creation was cancelled."
    success: "<green>You founded <white><name></white>!"
    broadcast: "<gold>The city of <name> has been founded by <player>!"

  disband:
    confirm-hint: "<red>This cannot be undone. Type <white>/city disband <name></white> to confirm."
    name-mismatch: "<red>That is not your city's name. Type <white><name></white> exactly."
    cancelled: "<red>Disbanding was cancelled."
    broadcast: "<gray>The city of <white><name></white> has been disbanded."

  invite:
    already-member: "<red>That player is already in this city."
    sent: "<green>Invited <white><player></white>. The invite expires shortly."
    received: "<gold><player></gold> has invited you to join <white><name></white>. Use <white>/city accept <name></white>."
    denied: "<gray>You declined the invite from <white><name></white>."

  join:
    no-invite: "<red>You have no pending invite from that city."
    not-open: "<red>That city is invite-only."
    already-in-city: "<red>You are already in a city."
    banned: "<red>You are banned from that city."
    full: "<red>That city is full, at <white><cap></white> members."
    cooldown: "<red>You left a city recently. You may join a different one in <white><hours></white> hours."
    no-rank: "<red>That city has no rank to assign you. Its mayor must create one."
    cancelled: "<red>Joining was cancelled."
    success: "<green>You joined <white><name></white>."
    announce: "<gray><player> joined the city."

  leave:
    confirm-hint: "<yellow>Type <white>/city leave confirm</white> to leave your city."
    mayor: "<red>The mayor cannot leave. Transfer mayorship or disband the city."
    cancelled: "<red>Leaving was cancelled."
    success: "<gray>You left <white><name></white>."
    announce: "<gray><player> left the city."

  kick:
    self: "<red>You cannot kick yourself. Use <white>/city leave confirm</white>."
    mayor: "<red>The mayor cannot be kicked."
    outranked: "<red>You cannot act on a member of equal or higher rank."
    cancelled: "<red>The kick was cancelled."
    success: "<green>Removed <white><player></white> from the city."
    kicked: "<red>You were removed from <white><name></white>."

  ban:
    mayor: "<red>The mayor cannot be banned."
    not-banned: "<red>That player is not banned from this city."

  transfer:
    not-mayor: "<red>Only the mayor can transfer mayorship."
    self: "<red>You are already the mayor."
    offline: "<red>That player must be online to accept mayorship."
    none: "<red>You have no pending mayorship offer."
    no-rank: "<red>This city has no mayor rank. Contact an administrator."
    cancelled: "<red>The transfer was cancelled."
    offered: "<yellow>Offered mayorship to <white><player></white>. They have a minute to accept."
    offer-received: "<gold><player></gold> is offering you mayorship of <white><name></white>. Use <white>/city accept</white>."
    accepted: "<green>You are now the mayor of <white><name></white>."
    announce: "<gold><player> is now the mayor."

  treasury:
    insufficient: "<red>The treasury needs <white><required> C</white> but holds <white><balance> C</white>."
    deposited: "<green>Deposited <white><amount></white>. The treasury now holds <white><treasury></white>."
    withdrawn: "<green>Withdrew <white><amount></white>. The treasury now holds <white><treasury></white>."
    cap: "<red>You may take at most <white><percent>%</white> of the treasury a day, which is <white><limit> C</white>. You have already taken <white><taken> C</white>, leaving <white><remaining> C</white>."

  settings:
    motd-set: "<green>Message of the day updated."
    open-on: "<green>Anyone may now join without an invite."
    open-off: "<green>The city is now invite-only."
    renamed: "<green>Your city is now called <white><name></white>."

  info:
    header: "<dark_gray>--- <gold><name></gold> ---"
    tag: "<gray>Tag: <white><tag>"
    mayor: "<gray>Mayor: <white><mayor>"
    members: "<gray>Members: <white><count></white>/<white><cap>"
    treasury: "<gray>Treasury: <white><amount> C"
    open: "<gray>Open join: <white><value>"
    motd: "<gray>MOTD: <white><motd>"

  list:
    header: "<dark_gray>--- <gold>Cities</gold> <gray>(page <page>/<pages>) ---"
    empty: "<gray>No cities have been founded yet."
    entry: "<white><name></white> <gray>- <white><members></white> members, mayor <white><mayor>"

  rank:
    header: "<dark_gray>--- <gold>Ranks of <name></gold> ---"
    entry: "<white><rank></white> <gray>weight <white><weight></white>, <white><permissions></white> permissions, <white><members></white> members"
    unknown: "<red>This city has no rank called <white><rank></white>."
    unknown-flag: "<red>There is no permission called <white><flag></white>."
    name-invalid: "<red>A rank name must be 1 to 16 characters."
    exists: "<red>This city already has a rank called <white><rank></white>."
    outranked: "<red>You cannot edit <white><rank></white>, its weight of <white><weight></white> is not below yours."
    cannot-grant: "<red>You cannot grant permissions you do not hold: <white><permissions></white>."
    weight-too-high: "<red>The weight must be at most <white><max></white>, below your own rank."
    weight-reserved: "<red>The weight must be at most <white><max></white>. The mayor's weight is reserved."
    weight-negative: "<red>The weight cannot be negative."
    cannot-delete-mayor: "<red>The mayor rank cannot be deleted."
    last: "<red>A city must keep at least one rank."
    no-fallback: "<red>There is no other rank to move these members to."
    mayor-not-default: "<red>The mayor rank cannot be the rank new members receive."
    mayor: "<red>The mayor's rank cannot be changed. Transfer mayorship instead."
    cancelled: "<red>The rank change was cancelled."
    already-highest: "<red>That member already holds the highest rank you can assign."
    already-lowest: "<red>That member already holds the lowest rank."
    created: "<green>Created rank <white><rank></white>."
    deleted: "<green>Deleted rank <white><rank></white>. Its members moved to the default rank."
    assigned: "<green><player> is now <white><rank></white>."
    perm-granted: "<green>Granted <white><flag></white> to <white><rank></white>."
    perm-revoked: "<green>Revoked <white><flag></white> from <white><rank></white>."

claim:
  # SPEC 6.3, buying land
  chunk-claimed: "<red>This chunk already belongs to another city."
  already-owned: "<red>Your city already owns this chunk."
  not-adjacent: "<red>A new chunk must share an edge with land you already own. Corners do not count."
  no-anchor: "<red>Your city owns nothing in this world. Use an outpost to settle a new one."
  too-close: "<red>This is inside another city's <white><chunks></white> chunk buffer."
  delinquent: "<red>Your city owes upkeep and cannot buy land until it is paid."
  at-war: "<red>Land cannot change hands while your city is at war."
  admin-protected: "<red>This chunk is protected by an administrator."
  out-of-range: "<red>This chunk is too far from the world origin to be claimed."
  cancelled: "<red>The claim was cancelled."
  radius-bounds: "<red>The radius must be between 1 and <white><max></white>."
  success: "<green>Claimed chunk <white><chunk></white> for <white><cost> C</white>."
  radius-success: "<green>Claimed <white><count></white> chunks for <white><cost> C</white>."

  # SPEC 6.4, giving it back
  not-yours: "<red>Your city does not own this chunk."
  core: "<red>The core chunk cannot be unclaimed. It is where your city began."
  contains-spawn: "<red>Your city spawn is in this chunk. Move it before unclaiming."
  breaks-contiguity: "<red>That would cut <white><count></white> chunks off from your city: <white><chunks></white>"
  unclaim-cancelled: "<red>The unclaim was cancelled."
  unclaim-success: "<gray>Released chunk <white><chunk></white>. <white><refund> C</white> went back to the treasury."
  unclaim-radius-success: "<gray>Released <white><count></white> chunks."
  radius-nothing: "<red>None of those chunks could be released."

  # SPEC 6.3, auto-claim
  auto-on: "<green>Auto-claim on. Walking into unclaimed land will buy it."
  auto-off: "<gray>Auto-claim off."
  auto-claimed: "<green>Auto-claimed <white><chunk></white> for <white><cost> C</white>."
  auto-stopped: "<yellow>Auto-claim turned off:"

  # SPEC 6.5, seeing it
  entering: "<green>Entering <city>"
  leaving: "<gray>Leaving <city>"
  wilderness: "<white>Wilderness"
  border-on: "<green>Showing claim borders."
  border-off: "<gray>Border display off."
  here-wilderness: "<gray>Chunk <white><chunk></white> is unclaimed."
  here-owned: "<gray>Chunk <white><chunk></white> belongs to <white><city></white> (<white><type></white>)."
  map-header: "<dark_gray>--- <gold>Chunk map</gold> <gray>(you are the marked chunk) ---"
  map-legend: "<gray>Legend: <green>your city <gray>| <yellow>ally <gray>| <red>enemy <gray>| <dark_gray>other <gray>| <white>wilderness"
  map:
    tile:
      own: "<green>#"
      ally: "<yellow>#"
      enemy: "<red>#"
      other: "<dark_gray>#"
      wilderness: "<white>-"
      self: "<gold><bold>@</bold></gold>"

protection:
  denied:
    build: "<red>You cannot build in <white><city></white>."
    container: "<red>You cannot open containers in <white><city></white>."
    container-take: "<red>You may look inside, but not take from, containers in <white><city></white>."
    interact: "<red>You cannot use that in <white><city></white>."
    bucket: "<red>You cannot use buckets in <white><city></white>."
    entity: "<red>You cannot harm that in <white><city></white>."
    trample: "<red>You cannot trample crops in <white><city></white>."
    villager: "<red>You cannot trade in <white><city></white>."
    pvp: "<red>Combat is disabled in <white><city></white> outside of war."

chat:
  city-format: "<gray>[<white><tag></white><gray>] "

market:
  disabled: "<red>The server market is closed."
  not-traded: "<red>The server does not trade <white><item></white>."
  empty-hand: "<red>Hold the item you want to price or sell."
  not-enough: "<red>You asked to sell <white><amount></white> but are holding <white><held></white>."
  you-have-none: "<red>You have no plain <white><item></white> to sell."
  no-room: "<red>You do not have room for that."
  rejected-damaged: "<red>The market only buys undamaged items."
  rejected-enchanted: "<red>The market only buys plain, unenchanted items."
  rejected-named: "<red>The market only buys items with no custom name or lore."
  rejected-contents: "<red>The market will not buy a container with items inside it."
  worthless: "<red><item> is worth nothing at the moment. Wait for the price to recover."
  worth: "<gray><item><gray>: the market pays <green><sell></green> and sells at <yellow><buy></yellow>."
  worth-stack: "<gray>Your <white><amount></white> would fetch <green><total></green> before tax."
  sell-usage: "<gray>Use <white>/sell hand [amount]</white> or <white>/sell all <material></white>."
  sold: "<green>Sold <white><amount>x <item></white> for <white><net></white> <gray>(<gross> less <tax> tax)<green>. Balance: <white><balance></white>."
  bought: "<green>Bought <white><amount>x <item></white> for <white><cost></white>. Balance: <white><balance></white>."
  list-header: "<gold>Server Market <gray>(page <white><page></white> of <white><pages></white>)"
  list-entry: "<gray>- <white><item></white>: sells to you at <yellow><buy></yellow>, buys from you at <green><sell></green>"
  list-empty: "<gray>The market trades nothing at the moment."

shop:
  no-chest: "<red>A shop sign must be placed on a chest or barrel."
  empty-chest: "<red>Put the item you want to trade in the chest first; the shop takes its item from there."
  invalid-quantity: "<red>The second line must be how many items one trade moves, such as <white>16</white>."
  quantity-too-large: "<red>One trade may move at most <white><max></white> items."
  invalid-offer: "<red>The third line must read <white>B 100</white>, <white>S 60</white>, or <white>B 100 : S 60</white>."
  invalid-price: "<red>That is not a valid price. Use plain numbers, like <white>100</white> or <white>99.50</white>."
  inverted-prices: "<red>Your shop would buy at <white><sell></white> and sell at <white><buy></white>, so anyone could trade it in circles for profit."
  sign-taken: "<red>There is already a shop on that sign."
  limit-reached: "<red>You already have <white><limit></white> shops, which is your limit."
  created: "<green>Shop created: <white><quantity>x <item></white>, sells at <white><buy></white>, buys at <white><sell></white>."
  removed: "<gray>Shop removed."
  removed-with-chest: "<gray><count> shops were removed with that chest."
  chest-missing: "<red>This shop's chest is gone."
  unknown-material: "<red>This shop trades an item the server no longer knows."
  info: "<gray>Your shop: <white><quantity>x <item></white>, sells at <white><buy></white>, buys at <white><sell></white>. In stock: <white><stock></white>."
  not-selling: "<red>This shop does not sell."
  not-buying: "<red>This shop does not buy."
  own-shop: "<gray>This is your own shop."
  out-of-stock: "<red>This shop is out of stock."
  inventory-full: "<red>You do not have room for that."
  chest-full: "<red>This shop's chest is full."
  you-have-none: "<red>You do not have enough to sell."
  owner-cannot-pay: "<red>The shop owner cannot pay for that right now."
  bought: "<green>Bought <white><amount>x <item></white> for <white><price></white>. Balance: <white><balance></white>."
  sold: "<green>Sold <white><amount>x <item></white> for <white><price></white>. Balance: <white><balance></white>."
  owner-sold: "<gray><player> bought <white><amount>x <item></white> from your shop for <white><price></white>."
  owner-bought: "<gray><player> sold <white><amount>x <item></white> to your shop for <white><price></white>."
