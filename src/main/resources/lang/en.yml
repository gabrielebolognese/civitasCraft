# SPEC 30.4, the trespass response. Rendered through Messenger, so SPEC 23.2's palette tokens
# resolve. The city's name is <subject> rather than <city>: "city" is also a palette colour, and
# a message cannot mean both at once -- the palette resolver would win and the name would
# render as a colour.
trespass:
  warning-title: "<war>WARNING"
  warning-subtitle: "<body><subject><cityname></subject> defenses are activating"
  warning: "<dim>[</dim><city>City</city><dim>]</dim> <neg>Leave <subject><cityname></subject> territory within <subject><seconds></subject> seconds.</neg>"
  alerted: "<dim>[</dim><neg>!</neg><dim>]</dim> <neg><subject><cityname></subject> defenses are hostile to you for <subject><seconds></subject> seconds.</neg>"
  city-notice: "<dim>[</dim><city>City</city><dim>]</dim> <neg>Trespasser detected:</neg> <subject><player></subject><body> at <subject>(<x>, <z>)</subject><body>.</body>"

# SPEC 30.4's five warden keys, plus the refusals SPEC 28.2's three gates need and the fallback
# SPEC does not supply. SPEC writes two of its keys with underscores (warden.defeated_peacetime,
# warden.destroyed_war); every key in this file is hyphenated, and a dotted child under a key that
# is itself requested would load as a MemorySection and render as one to players.
warden:
  disabled: "<red>This server does not offer a City Warden."
  # SPEC 28.2's three gates, each naming the remedy rather than only the refusal.
  already-owned: "<red>Your city already has a City Warden. There is only ever one."
  needs-fortification: "<red>A City Warden needs Fortification level <white><required></white>. Yours is <white><level></white>."
  not-core-chunk: "<red>The City Warden may only be placed in your core chunk, and can never be moved."
  recovering: "<gray>Your City Warden is underground. It returns in <white><time></white>."
  purchased: "<gold><city></gold> <gray>has awakened a <gold>City Warden</gold>."
  purchased-title: "<gold>City Warden"
  # SPEC 30.4's warden.emerged, shown once per alert to the one player it woke up for.
  emerged-title: "<dark_red>The Warden stirs"
  placed: "<green>The City Warden has risen in your core chunk.</green> <gray>It guards the City Hall and never leaves it."
  # SPEC 30.4 names {player} as the killer. Peacetime damage often has no player behind it, so
  # there are two messages rather than one that says "killed by ?".
  defeated-peacetime: "<dark_gray>[</dark_gray><aqua>City</aqua><dark_gray>]</dark_gray> <red>Your City Warden was driven underground</red> <gray>by <white><killer></white>. It returns in <white><hours></white> hours."
  defeated-peacetime-environment: "<dark_gray>[</dark_gray><aqua>City</aqua><dark_gray>]</dark_gray> <red>Your City Warden was driven underground.</red> <gray>It returns in <white><hours></white> hours."
  returned: "<dark_gray>[</dark_gray><aqua>City</aqua><dark_gray>]</dark_gray> <green>Your City Warden has returned."
  destroyed-war: "<dark_red>The City Warden of <white><city></white> has fallen."
  # SPEC 30.2 case 99. The only path in the plugin that refunds a defense unit, because an
  # operator moving a chunk is not a game outcome.
  admin-refunded: "<gray>Your City Warden was removed by staff and <green><amount></green> was returned to the treasury."
  status-none: "<gray>Your city has no City Warden. <white>750,000 C</white> at Fortification <white><required></white>."
  status-standing: "<gold>City Warden <gray>| <white><health></white>/<white><max></white> health, guarding <white>(<x>, <z>)</white>."

