  cannot-afford: "<red>That costs <white><cost></white> and you have <white><balance></white>."
  no-destination: "<red>There is nowhere to send you."
  kind-spawn: "spawn"
  kind-rtp: "the wilds"
  kind-rtp-resource: "the resource worlds"
  kind-warp: "warps"
  kind-mine-tp: "your mining claim"
  kind-outpost-tp: "your outpost"
  rtp-searching: "<gray>Looking for somewhere to put you..."
