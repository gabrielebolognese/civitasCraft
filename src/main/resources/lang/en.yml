rules:
  title: "<gold>Server Rules"
  author: "CivitasCraft"
  page-welcome: "<dark_gray><bold>CivitasCraft\n\n<black>Build a city. Farm, trade, claim land, and fight wars you cannot lose your build to.\n\n<dark_gray>Every rule here exists because it surprised somebody."
  page-cities: "<dark_gray><bold>Cities\n\n<black>You may belong to one city. Leaving one locks you out of joining another for a day, so a war cannot be won by hiring the other side.\n\nRanks decide what you may do. Ask your mayor."
  page-land: "<dark_gray><bold>Land\n\n<black>A claim protects a chunk. Land you have not claimed is not yours, <bold>even if you built on it<reset><black>.\n\nSomebody may claim the ground under your build and it is not theft. Claim first, build second."
  page-money: "<dark_gray><bold>Money\n\n<black>Land costs money to hold, every day. A city that stops playing slowly runs out and loses its outer chunks.\n\nNothing earns while you sleep. Selling to the market drops its price, so spread out."
  page-war: "<dark_gray><bold>War\n\n<black>Wars are declared, prepared for, and fought in a fixed window.\n\n<bold>Every block broken in a war is put back.<reset><black> Burn it, flood it, blow it up: at the end the world is restored exactly as it was. What you stake is money and reputation."
  page-loot: "<dark_gray><bold>The one exception\n\n<black>Blocks come back. <bold>Items taken out of a chest by hand do not.<reset><black>\n\nSo breaking storage achieves nothing, and looting it achieves a great deal.\n\nPut anything you cannot lose in the city vault before a war. The vault cannot be looted."
  page-conduct: "<dark_gray><bold>Conduct\n\n<black>Alt accounts earn nothing and count for nothing.\n\nEvery coin that moves is logged and an admin can read it.\n\n<dark_gray>/report <player> <reason>"

civitas:
  about-header: "<dark_gray>--- <gold>CivitasCraft<dark_gray> ---"
  about-version: "<gray>Version <white><version>"
  about-help: "<gray>Commands: <white>/city help"
  about-rules: "<gray>Server rules: <white>/civitas rules"

# SPEC 23.3's message prefixes. The palette tokens (<dim>, <money>, <city>...) are defined in
# code by Palette, so changing a colour never means touching a message string.
prefixes:
  economy: "<dim>[</dim><money>$</money><dim>]</dim> "
  city: "<dim>[</dim><city>City</city><dim>]</dim> "
  land: "<dim>[</dim><land>Land</land><dim>]</dim> "
  war: "<dim>[</dim><war>War</war><dim>]</dim> "
  quest: "<dim>[</dim><quest>Quest</quest><dim>]</dim> "
  ally: "<dim>[</dim><ally>Diplomacy</ally><dim>]</dim> "
  server: "<dim>[</dim><ally>Server</ally><dim>]</dim> "
  admin: "<dim>[</dim><admin>Admin</admin><dim>]</dim> "
  error: "<dim>[</dim><neg>!</neg><dim>]</dim> "
  success: "<dim>[</dim><pos>+</pos><dim>]</dim> "
  # Compact mode, SPEC 23.3: one character instead of a word.
  compact-economy: "<money>$</money> "
  compact-city: "<city>C</city> "
  compact-land: "<land>L</land> "
  compact-war: "<war>W</war> "
  compact-quest: "<quest>Q</quest> "
  compact-ally: "<ally>D</ally> "
  compact-server: "<ally>S</ally> "
  compact-admin: "<admin>A</admin> "
  compact-error: "<neg>!</neg> "
  compact-success: "<pos>+</pos> "

