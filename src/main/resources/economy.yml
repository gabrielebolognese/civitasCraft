# Economy: income sources, sinks, market and bounties.
# SPEC.md Sections 4.2 to 4.8, exposed as config per SPEC 16.4.

# Hard ceiling on any single balance, SPEC 17.3 case 27.
max-balance: 1000000000000
currency-symbol: "C"

income:
  starting-balance: 2000

  stipend:
    enabled: true
    amount: 40
    interval-minutes: 15
    required-actions: 3
    daily-cap: 640
    # Cumulative blocks moved that counts as one "moved" action, SPEC 4.2.1.
    move-distance-blocks: 32
    # SPEC 17.6 case 70: new accounts earn nothing until this much active playtime.
    min-active-playtime-minutes: 30

  daily-login:
    enabled: true
    base: 250
    streak-bonus: 125
    max: 1000
    streak-reset-hours: 48

  quests:
    enabled: true
    per-day: 3
    reward-min: 300
    reward-max: 800
    # SPEC 13.1 scales quest difficulty with playtime "so veterans do not trivially clear
    # beginner quests, but rewards scale with it too, so the effort-to-reward ratio stays
    # flat". One factor multiplies both target and reward, so the ratio is flat by
    # construction. A linear ramp from 1x at no playtime to max-scale at scale-hours,
    # flat after that so a veteran's quests stop growing rather than becoming a job.
    scale-hours: 100.0
    max-scale: 2.5
    # The SPEC 13.1 pool. Weight is relative: a weight of 2 comes up twice as often as a 1.
    # Every metric here must exist in QuestMetric, and a line naming one that does not is
    # logged and skipped rather than handed out as an impossible quest.
    pool:
      harvest-wheat:
        category: farming
        metric: HARVEST_CROPS
        target: 256
        reward-min: 300
        reward-max: 600
        weight: 2.0
      breed-animals:
        category: farming
        metric: BREED_ANIMALS
        target: 20
        reward-min: 300
        reward-max: 500
        weight: 1.5
      place-blocks:
        category: building
        metric: PLACE_BLOCKS
        target: 512
        reward-min: 400
        reward-max: 700
        weight: 2.0
      craft-items:
        category: building
        metric: CRAFT_ITEMS
        target: 64
        reward-min: 350
        reward-max: 600
        weight: 1.5
      mine-ore:
        category: mining
        metric: MINE_ORE
        target: 128
        reward-min: 400
        reward-max: 700
        weight: 2.0
      sell-to-market:
        category: trading
        metric: MARKET_SELL_VALUE
        target: 5000
        reward-min: 400
        reward-max: 800
        weight: 1.5
      deposit-treasury:
        category: social
        metric: TREASURY_DEPOSIT
        target: 2000
        reward-min: 300
        reward-max: 500
        weight: 1.0
      visit-biomes:
        category: exploration
        metric: VISIT_BIOMES
        target: 3
        reward-min: 350
        reward-max: 600
        weight: 1.0

  challenges:
    enabled: true
    per-week: 2
    reward-min: 2500
    reward-max: 8000
    # SPEC 13.2. Progress is pooled across every member of the city, and the reward goes to
    # the treasury, so these targets are city-sized rather than player-sized. They are not
    # scaled by playtime: a city is not one player and has no single playtime to scale by.
    pool:
      city-harvest:
        category: farming
        metric: HARVEST_CROPS
        target: 25000
        reward-min: 2500
        reward-max: 5000
        weight: 2.0
      city-build:
        category: building
        metric: PLACE_BLOCKS
        target: 50000
        reward-min: 3000
        reward-max: 6000
        weight: 2.0
      city-market:
        category: trading
        metric: MARKET_SELL_VALUE
        target: 500000
        reward-min: 4000
        reward-max: 8000
        weight: 1.5
      city-mine:
        category: mining
        metric: MINE_ORE
        target: 20000
        reward-min: 3000
        reward-max: 6000
        weight: 1.5

  contest-prizes:
    first: 50000
    second: 25000
    third: 12000

  newcomer:
    # SPEC 4.2 and 15.1: all personal income multiplied for new players.
    multiplier: 1.5
    days: 14

sinks:
  # Values duplicated from cities.yml / war.yml / defense.yml live in those files.
  # This block holds the sinks that belong to no other module.
  market-sale-tax-percent: 5


# SPEC 21.4's Class F mitigations: exploits internal to this plugin rather than to Minecraft.
# Part I built each of these systems with a reasonable rule; Part II audited them
# adversarially and found a way around every one.
anti-abuse:
  # F12. No income of any kind until an account has this much ACTIVE playtime, so an alt
  # parked in a corner never qualifies. Raised from SPEC 17.6 case 70's thirty minutes.
  new-account-income-block-minutes: 60
  # F12. The daily reward also needs this much active playtime on the day itself, which stops
  # a farm of established alts logging in for a second each morning.
  daily-login-requires-active-minutes: 30
  # F16. A new member cannot withdraw from the treasury at all for this long, whatever their
  # rank. The mayor is exempt. The 25% cap bounds how much; this bounds how soon.
  treasury-withdraw-member-age-hours: 72
  # F11. The SPEC 4.2.1 actions must fall in this many separate minutes of the interval. A
  # macro can produce three action types in one burst; it cannot produce three minutes.
  stipend-required-distinct-minutes: 3
  # F9 and F10. How long the cache remembers that a player placed or broke a block, so that
  # placing and breaking the same block cannot complete a quest.
  placed-block-cache-ttl-hours: 24
  # How many chunks that cache holds before evicting the least recently used. SPEC 21.10.5
  # requires a bound and names no number, so this one is not from SPEC.
  placed-block-cache-max-chunks: 4096
  # F4. A war ranks on the leaderboard only if the loser scored at least this share of the
  # winner's score. Collusive walkovers are still recorded, they simply do not rank.
  war-leaderboard-min-loser-score-percent: 25

market:
  enabled: true

  # SPEC 21.5, the daily sell quota. This is the one number that bounds how much money the
  # server can create in a day, whatever exploit anyone finds, so change it knowing that
  # SPEC 21.5's money-creation table is computed from it.
  #
  # It is a SOFT cap. Past the quota a player may still sell, at over-quota-multiplier of
  # the value: "hard blocks feel like punishment and generate support tickets. Soft caps
  # feel like diminishing returns and generate shrugs."
  #
  # Player-to-player shops are deliberately exempt, so a player with a huge farm sells to
  # other players rather than to the void. That moves money instead of creating it.
  quota-enabled: true
  daily-sell-quota: 25000
  over-quota-multiplier: 0.2
  # 0 is midnight server time, which is when the daily quests reset too.
  quota-reset-hour: 0
  # SPEC 23.5.1 warns the player once, on the sale that crosses this share of the quota.
  quota-warn-percent: 80
  # price = base_price * clamp((target_stock / (current_stock + 1)) ^ elasticity, min, max)
  default-elasticity: 0.45
  clamp-min: 0.25
  clamp-max: 3.0
  # The market sells to players at price * spread.
  buy-spread: 1.35
  # Stock decays toward target_stock by this fraction each hour, SPEC 4.4.
  stock-decay-percent-per-hour: 2.0
  # How often the decay above is applied. SPEC 4.4 states the rate per hour, so the
  # interval matches it: a shorter interval at the same percentage would decay faster
  # than the documented rate.
  decay-interval-minutes: 60
  # SPEC 17.3 case 29 and 30: the market only accepts plain vanilla items.
  reject-damaged: true
  reject-enchanted: true
  reject-named: true
  reject-containers-with-contents: true
  # SPEC 11.9's winner bonus lives in war.yml under rewards, which is where the war
  # module reads it. It was mirrored here and the mirror was read by nothing.

  # ------------------------------------------------------------------------------------
  # WHAT THE SERVER BUYS FROM PLAYERS, SPEC 21.9
  # ------------------------------------------------------------------------------------
  # This is the money faucet, and it is the only one. SPEC 21.6: "every item the server
  # buys is a potential money faucet. Every item the server sells is a money sink and
  # carries no exploit risk at all."
  #
  # Four checks run over this list at startup and the market REFUSES TO OPEN if any fails
  # (SPEC 21.10.1). None of them can be switched off, and SPEC 21.10.4 is explicit about
  # why: "An admin cannot add emeralds to the buy list, even by editing the yml, even by
  # editing the database."
  #
  #   1. Nothing here may be on the hard blacklist  (SPEC 21.8, in code)
  #   2. Nothing here may come out of a villager trade
  #   3. No two entries may share a crafting equivalence class  (SPEC 21.3)
  #   4. Every entry needs its "# automatable:" comment, below
  #
  # The automatable comment is REQUIRED and is a forcing function, not a setting: SPEC
  # 21.1 says "automation is the enemy of a priced economy", so adding an item means
  # answering the question that decides whether it belongs here at all. It goes on the
  # line ABOVE its entry, which is the only position Bukkit both reads back and keeps
  # when the plugin writes new keys into this file.
  #   no    a player must be present and playing to obtain it
  #   semi  a farm can produce it, and the daily quota is what bounds it
  # An item a machine produces with no player present belongs on neither list.
  buy:
    # automatable: no
    DIAMOND:         { base-price: 400,  target-stock: 1500,  elasticity: 0.60 }
    # automatable: no
    ANCIENT_DEBRIS:  { base-price: 2500, target-stock: 150,   elasticity: 0.70 }
    # automatable: no
    QUARTZ:          { base-price: 12,   target-stock: 8000,  elasticity: 0.50 }
    # automatable: no
    ECHO_SHARD:      { base-price: 800,  target-stock: 200,   elasticity: 0.70 }
    # automatable: no
    HEART_OF_THE_SEA: { base-price: 1200, target-stock: 100,  elasticity: 0.75 }
    # automatable: no
    TORCHFLOWER:     { base-price: 300,  target-stock: 300,   elasticity: 0.65 }
    # automatable: no
    PITCHER_POD:     { base-price: 300,  target-stock: 300,   elasticity: 0.65 }
    # automatable: no
    TRIAL_KEY:       { base-price: 600,  target-stock: 300,   elasticity: 0.70 }
    # automatable: semi
    WHEAT:           { base-price: 3,    target-stock: 20000, elasticity: 0.40 }
    # automatable: semi
    CARROT:          { base-price: 3,    target-stock: 20000, elasticity: 0.40 }
    # automatable: semi
    POTATO:          { base-price: 3,    target-stock: 20000, elasticity: 0.40 }
    # automatable: semi
    BEETROOT:        { base-price: 4,    target-stock: 15000, elasticity: 0.40 }
    # automatable: semi
    OAK_LOG:         { base-price: 4,    target-stock: 25000, elasticity: 0.40 }
  # ------------------------------------------------------------------------------------
  # WHAT THE SERVER SELLS TO PLAYERS, SPEC 21.6
  # ------------------------------------------------------------------------------------
  # The builder's shop, and the plugin's largest money sink. None of the checks above
  # apply here, because selling creates no money: "A builder buying 20,000 quartz blocks
  # removes a large amount of money from circulation in one transaction, which is exactly
  # what a sink should do."
  #
  # A key is either a single material or one of the GROUP names below, which expand to
  # every material they cover. SPEC 21.6 describes this catalogue as a paragraph rather
  # than a table, and hand-listing several hundred materials would stop covering it the
  # day Mojang adds a wood type. Prices follow SPEC's "1.5x to 4x the value of their raw
  # inputs"; a group is priced as a whole, so every stair costs the same whatever it is
  # made of. Name a material directly to price it on its own.
  #
  # Groups: stairs, slabs, walls, fences, wool, carpet, banners, candles, terracotta,
  #   planks, doors, trapdoors, concrete, concrete-powder, glazed-terracotta,
  #   stained-glass, glass-panes, dyes, stone-variants, deepslate-variants,
  #   quartz-variants, prismarine, purpur, copper, mud-and-mangrove, amethyst,
  #   nether-building, sandstone
  sell:
    stone-variants:     { base-price: 4,   target-stock: 200000, elasticity: 0.15 }
    deepslate-variants: { base-price: 5,   target-stock: 150000, elasticity: 0.15 }
    sandstone:          { base-price: 5,   target-stock: 120000, elasticity: 0.15 }
    nether-building:    { base-price: 8,   target-stock: 80000,  elasticity: 0.20 }
    quartz-variants:    { base-price: 20,  target-stock: 60000,  elasticity: 0.25 }
    prismarine:         { base-price: 18,  target-stock: 40000,  elasticity: 0.25 }
    purpur:             { base-price: 14,  target-stock: 40000,  elasticity: 0.25 }
    copper:             { base-price: 30,  target-stock: 30000,  elasticity: 0.30 }
    amethyst:           { base-price: 40,  target-stock: 20000,  elasticity: 0.30 }
    mud-and-mangrove:   { base-price: 6,   target-stock: 60000,  elasticity: 0.20 }
    planks:             { base-price: 5,   target-stock: 150000, elasticity: 0.15 }
    stairs:             { base-price: 6,   target-stock: 100000, elasticity: 0.20 }
    slabs:              { base-price: 4,   target-stock: 100000, elasticity: 0.20 }
    walls:              { base-price: 6,   target-stock: 80000,  elasticity: 0.20 }
    fences:             { base-price: 6,   target-stock: 80000,  elasticity: 0.20 }
    doors:              { base-price: 10,  target-stock: 40000,  elasticity: 0.25 }
    trapdoors:          { base-price: 10,  target-stock: 40000,  elasticity: 0.25 }
    wool:               { base-price: 12,  target-stock: 60000,  elasticity: 0.20 }
    carpet:             { base-price: 8,   target-stock: 60000,  elasticity: 0.20 }
    banners:            { base-price: 40,  target-stock: 10000,  elasticity: 0.30 }
    candles:            { base-price: 25,  target-stock: 20000,  elasticity: 0.30 }
    terracotta:         { base-price: 10,  target-stock: 80000,  elasticity: 0.20 }
    glazed-terracotta:  { base-price: 24,  target-stock: 30000,  elasticity: 0.25 }
    concrete:           { base-price: 10,  target-stock: 80000,  elasticity: 0.20 }
    concrete-powder:    { base-price: 8,   target-stock: 80000,  elasticity: 0.20 }
    stained-glass:      { base-price: 12,  target-stock: 60000,  elasticity: 0.20 }
    glass-panes:        { base-price: 6,   target-stock: 60000,  elasticity: 0.20 }
    dyes:               { base-price: 14,  target-stock: 40000,  elasticity: 0.25 }
    GLASS:              { base-price: 8,   target-stock: 100000, elasticity: 0.20 }
    GLOWSTONE:          { base-price: 30,  target-stock: 20000,  elasticity: 0.30 }
    SEA_LANTERN:        { base-price: 45,  target-stock: 10000,  elasticity: 0.30 }
    BOOKSHELF:          { base-price: 35,  target-stock: 20000,  elasticity: 0.25 }


player-shops:
  enabled: true
  default-limit-per-player: 5
  sign-header: "[Shop]"
  # An upper bound on the second line of a sign, so a typo cannot ask for a trade nobody
  # could carry. 2,304 is a full double chest of a stackable item.
  max-quantity-per-transaction: 2304

bounties:
  enabled: true
  minimum: 1000
  expiry-days: 30
  # How many are shown by /bounty list, and how often expired ones are swept and refunded.
  # Neither number is from SPEC, which gives the 30-day expiry but not the sweep.
  list-size: 20
  expiry-sweep-minutes: 60

inflation:
  # SPEC 4.8
  enabled: true
  log-interval-minutes: 60
  weekly-growth-warn-percent: 15
  # How long circulation readings are kept. Only the last week is read, but keeping
  # more lets an admin see a trend.
  keep-days: 60

# SPEC 20 decision 7. Only takes effect if Vault is installed; turn it off if another
# plugin should own the server economy.
vault:
  enabled: true

audit:
  # SPEC 17.6 case 79, /ca audit suspicious heuristics.
  single-withdrawal-percent-of-treasury: 40
  transfers-to-same-player-per-hour: 5
  income-multiple-of-lifetime-earnings-24h: 3
  new-account-receive-threshold: 100000
  treasury-drop-percent: 60
  treasury-drop-window-minutes: 10
  income-rate-percentile-multiple: 3
  # Reasons are mandatory on admin economy commands when strict mode is on.
  strict-admin-reasons: true

# SPEC 21.4 Class G, the money supply snapshot.
#
# "The plugin must be able to answer, at any moment, 'how much money exists and where did it come
# from.' Without this you cannot detect an exploit you did not predict."
#
# Part II's threat catalogue closes about thirty known exploits. This is the instrument for the
# thirty-first: an exploit nobody has thought of still shows up as money appearing under some
# ledger type faster than it should, held by somebody, and /ca eco supply, sources and top are the
# three views of exactly that.
#
# Only the STOCKS are stored here -- wallets, treasuries and escrow. The flows are read back out
# of the ledger, which already holds every one of them and which SPEC 1.5 makes authoritative; a
# second copy could disagree with the record an investigation would be reading.
supply:
  # How often a reading is taken. SPEC 21.4 says hourly.
  interval-minutes: 60
  # How much history to keep. Ninety days is a season, which is the window a /ca eco supply
  # question is usually asked over.
  keep-days: 90

# SPEC 21.7's circuit breakers.
#
# Every other defence in Part II names an exploit and closes it. This one names none. SPEC 21.4
# C6: "You cannot enumerate future exploits. The circuit breaker is the mitigation for the
# exploits you have not thought of yet, and it is the single most valuable safety mechanism in
# this section."
#
# Every threshold is a RATIO against recent history rather than an absolute figure, because an
# absolute figure is a guess about how big this server will be and a ratio is not. The baselines
# come from the ledger, not from a counter -- a counter resets on restart, and a breaker whose
# baseline resets when the server does is one an exploiter turns off by crashing it.
#
# What a trip closes is deliberately narrow. SPEC 21.7: "Freezing sells rather than the whole
# economy is deliberate. Players can still buy, trade with each other, claim, and play. Only the
# money faucet closes. A server that halts entirely because of a suspected exploit does more
# damage than the exploit."
#
# A freeze LATCHES. It is cleared by /ca breaker reset and by nothing else -- resetting itself
# when the hour ticks over would reopen the market to whatever tripped it while nobody was awake.
circuit-breaker:
  enabled: true

  # Server-wide money creation in one hour, against the 7-day hourly average. Freezes sells.
  hourly-creation-multiplier-trigger: 3.0
  # One player's 24h income against their own 30-day daily average. Throttles that player only:
  # closing the whole market because somebody had an extraordinary day punishes everybody else.
  player-income-multiplier-trigger: 10.0
  # One item's hourly sell volume against its own 7-day hourly average. Takes THAT ITEM off the
  # buy list and leaves the rest of the market open, because a new vector is usually one item.
  item-volume-multiplier-trigger: 20.0

  # Circulation week over week. SPEC 4.8 already warns at 15 and deliberately does nothing else
  # ("silent balance reduction destroys player trust"); 40 is growth no legitimate week produces.
  weekly-inflation-warn-percent: 15
  weekly-inflation-freeze-percent: 40

  # FREEZE_SELLS or WARN_ONLY. WARN_ONLY still logs, still alerts admins and still writes the
  # audit row -- an operator choosing it has chosen to be told rather than protected, which is a
  # real choice on a server whose staff are awake.
  action-on-trip: FREEZE_SELLS

  # How often the sweep runs. Hourly, matching the window the first rule measures.
  check-interval-minutes: 60
