# World layout, SPEC 32.
#
# This file says what each world IS. Which worlds a city may claim in stays in config.yml
# under worlds.city-enabled and worlds.blacklisted, where SPEC 16.1 put it, so that no
# concept ends up with two names in two files.
#
#
# THERE IS NO WORLD BORDER, AND THAT IS DELIBERATE.
#
# SPEC 37 sketched a dynamic border that grew with the city count. SPEC 32.3 rejects it:
# "The vanilla Minecraft border stands, unchanged, at roughly 30 million blocks. The plugin
# does not impose, expand, or manage a border of any kind."
#
# The reasoning is worth keeping next to the absence, because the absence looks like an
# oversight: "Extremely low density is the point. A world where a player can travel two
# hundred thousand blocks and build entirely alone is doing something no curated server can
# offer. Density is not a metric to optimise. Emptiness is the atmosphere, and the ability to
# disappear into it is a feature."
#
# Structure comes from where the game SENDS people, not from where it stops them. That is
# /rtp's radius, which arrives with the travel milestone.

worlds:
  # SPEC 32.2's main overworld: cities, outposts, contests and wars. This resolves SPEC 20
  # Open Decision 4 — a city and its outposts exist here and nowhere else.
  main: world

  # Reachable and playable, and nothing may be claimed in either. This resolves SPEC 20 Open
  # Decision 1: the Nether and the End are not claimable.
  main-nether: world_nether
  main-end: world_the_end

  # SPEC 32.5's resource worlds. City claims are blocked entirely; these exist to be mined.
  #
  # They are NOT on an automatic reset schedule, which is where this project departs from
  # standard practice. SPEC 32.5: "Mines are infrastructure. A player who spends three weeks
  # digging a proper quarry with rail lines, lighting, storage and sorting has built
  # something, and wiping it monthly punishes exactly the long-term investment a
  # building-focused server should reward."
  resource: resource
  resource-nether: resource_nether

  # Where SPEC 32.6's personal Mining Claims may be staked. One chunk each, the only land
  # ownership available to a player with no city, and deliberately available to them.
  #
  # The claims themselves arrive with their own milestone; this list is what decides where
  # they will be allowed.
  mining-claimable:
    - resource
    - resource_nether

# SPEC 32.7's travel table. Every destination has a cost, a cooldown in seconds and a warmup
# in seconds, and every warmup is cancelled by movement or by damage.
travel:
  # The server hub. Free and short, because it is how a player gets out of trouble.
  spawn:
    cost: 0
    cooldown: 60
    warmup: 5

  # SPEC 32.4's random teleport, and the single number that gives the world its shape.
  #
  # With no border (SPEC 32.3), "structure comes from where the game SENDS people, not from
  # where it stops them". Inside max-radius is the settled core: every player who ever used
  # /rtp started there, so cities cluster, borders touch and travel between them is practical.
  # Beyond it is frontier, reachable only by walking, and a city out there chose to be.
  #
  # Widening this scatters the playerbase and quiets the map. Narrowing it crowds them.
  rtp:
    cost: 500
    cooldown: 300
    warmup: 5
    max-radius: 15000
    # Wider for the resource worlds, SPEC 32.4: they exist to be dug into, and spreading
    # arrivals slows the depletion of the ground near their spawn.
    resource-max-radius: 25000
    # Never drop somebody this close to another player, SPEC 32.4.
    min-player-distance: 200
    # SPEC 32.4: "If 40 candidate locations fail validation, report honestly and refund."
    max-attempts: 40

  # Random teleport into a resource world. Free, because mining is meant to be reachable.
  rtp-resource:
    cost: 0
    cooldown: 120
    warmup: 5

  # Admin-defined public warps, SPEC 32.7. Created with /ca warp set.
  warp:
    cost: 0
    cooldown: 30
    warmup: 5

# SPEC 32.6's personal mining claims.
#
# SPEC 32.5 blocks city claims in the resource worlds and SPEC 33.5 blocks PvP there, which
# leaves everything a player builds in the place the economy expects them to mine wide open to
# griefing — so nobody builds there. One chunk each is the answer: enough for a mine entrance,
# storage and a base, and not enough to be territory.
#
# This is also the ONLY land ownership available to a player with no city, and SPEC 32.6 says
# that is deliberate rather than an oversight.
#
# Setting enabled: false is the other position SPEC 33.5 describes — the resource worlds as
# purely extractive, with the Guide Book stating plainly that nothing built there is safe.
mining-claims:
  enabled: true
  cost: 15000
  # Charged daily from the owner's OWN balance, not a city treasury. That is the point.
  upkeep-per-day: 500
  # One each. More via civitas.limit.miningclaims.<n>.
  base-limit: 1
  max-trusted: 4
  # Unpaid upkeep releases the claim after this long. SPEC 32.6: "Blocks are not removed."
  grace-days: 7
  # Half, matching what SPEC 6.4 refunds on city land.
  unclaim-refund-percent: 50

  # How often the upkeep sweep runs. Its own timer rather than a line in the city sweep,
  # because the two charge different accounts: a city pays from its treasury and a mining
  # claim from its owner's own wallet.
  check-interval-minutes: 60

  # SPEC 32.7's /mine tp.
  teleport:
    cost: 100
    cooldown: 180
    warmup: 8
