# PvP and death, SPEC 33.
#
#
# THE ONE SETTING THAT DECIDES WHAT THIS SERVER FEELS LIKE
#
# SPEC contradicts itself on peacetime PvP, and it is not a small disagreement.
#
#   SPEC 33.1, 33.3 and 33.10 enable it: the wilderness is PvP with keepInventory on,
#   "for skirmishing, bounty hunting, and the tension of travel".
#
#   SPEC 37 and SPEC 38's milestone row disable it: "Peacetime PvP disabled globally."
#
# This ships DISABLED, which is the conservative reading, for three reasons. Part I's
# pillar 1.4 says "outside of declared wars, the world is fully protected", and SPEC 1
# makes the pillars decide ambiguous calls. Nobody can be killed unexpectedly. And turning
# it on later adds something, where turning it off later takes something away from players
# who have got used to it.
#
# Set peacetime: true to get SPEC 33's design instead. Nothing else needs to change.
#
# Recorded in OPEN_QUESTIONS.md as a decision for the developer.

pvp:
  # Whether players may fight each other while no war involves them.
  peacetime: false

  # Places where PvP is off whatever else is true, SPEC 37.
  #   SPAWN            the built hub, so a new player cannot be killed while reading a sign
  #   ADMIN_PROTECTED  any chunk an admin marked with /ca claim protect
  #   MINING_CLAIM     a personal mining claim, SPEC 32.6
  # Remove an entry to stop treating it as a sanctuary.
  exclusion-zones:
    - SPAWN
    - ADMIN_PROTECTED
    - MINING_CLAIM

  # How far the spawn sanctuary reaches, in chunks from the main world's spawn chunk.
  spawn-radius-chunks: 8

  # SPEC 33.5: PvP is disabled in the resource worlds at all times, INCLUDING during wars.
  # "Their entire purpose is to be the place where the economy's mining income happens, and
  # that requires being able to mine without watching for ambushes. Enabling war PvP there
  # would make the primary income source unavailable to whichever side is losing a war,
  # which compounds a defeat into an economic collapse."
  resource-worlds: false

  # SPEC 33.8's combat tag. Refreshes on each hit, never stacks: twenty arrows from one
  # engagement must not be a ten-minute lockout.
  #
  # "120 seconds, not 300. Five minutes is long enough that a single arrow from an unseen
  # archer locks a player out of teleporting for the length of a real activity."
  combat-tag-seconds: 30
  war-combat-tag-seconds: 120

  # SPEC 33.8: the countdown is required, not decorative. "A player must never be surprised
  # that a teleport was refused."
  tag-actionbar: true

  # SPEC 33.9 case 121: no near-miss grace. A rule with an edge to play for is one players
  # will play for.
  kill-on-combat-logout: true

  # SPEC 33.6: how long after placing TNT, fire, lava or a crystal its author still answers
  # for a death it causes. Outside the window it is an environmental death.
  attribution-window-seconds: 30

  # SPEC 33.6's table. keep-in-war false is what gives raiding real weight, and SPEC 33.6
  # states the tradeoff honestly: it also means wealth converts into war power. SPEC 33.7's
  # war graves are the intended remedy if that proves too punishing, not turning this back on.
  keep-inventory-peacetime-pvp: true
  keep-inventory-war-pvp: false
  keep-inventory-environment: false
  keep-inventory-mob: false

  # SPEC 37: a player cannot be attacked, and cannot attack, for this long after arriving.
  # Both directions, per SPEC 33.9 case 123: "Immunity is not a one-way shield."
  join-grace-seconds: 10
  respawn-grace-seconds: 10
