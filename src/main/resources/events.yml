# Scheduled server-wide events and building contests.
# SPEC.md Sections 13.4 and 13.5, exposed as config per SPEC 16.4.

events:
  enabled: true
  # Minutes of advance warning before an event starts, SPEC 13.5.
  announce-minutes-before: 30
  boss-bar: true

  # SPEC 13.5 calls these "automatic, scheduled, config-driven" but never says how often one
  # fires or how the next is chosen, so the three scheduling numbers here are this
  # implementation's rather than the specification's.
  #
  # How long after one event ends before the next is picked.
  interval-hours: 12
  # How often the scheduler looks. Far more often than it acts, because an event boundary is a
  # wall-clock moment and the server may have been down when it passed.
  check-interval-minutes: 5
  # How long an event waits before it may be drawn again. Without this a weighted draw hands
  # out Double Upkeep three times a fortnight, which players read as broken rather than
  # unlucky. An event may override it with its own cooldown-hours.
  default-cooldown-hours: 72

  definitions:
    market-boom:
      display-name: Market Boom
      duration-hours: 6
      sell-price-percent: 140
      weight: 1.5

    market-crash:
      display-name: Market Crash
      duration-hours: 6
      sell-price-percent: 70
      buy-price-percent: 70
      weight: 1.0

    harvest-festival:
      display-name: Harvest Festival
      duration-hours: 24
      crop-growth-multiplier: 2.0
      farming-quest-reward-multiplier: 2.0
      weight: 1.5

    gold-rush:
      display-name: Gold Rush
      duration-hours: 12
      mining-quest-reward-multiplier: 2.0
      # SPEC 13.5 words this as an "ore generation bonus via a temporary loot modifier".
      # Generation cannot change once a chunk exists, so this multiplies what ore drops.
      # See OPEN_QUESTIONS.md.
      ore-drop-multiplier: 2.0
      weight: 1.5

    invasion:
      display-name: Invasion
      duration-hours: 4
      wave-interval-minutes: 20
      mobs-per-wave: 20
      spawn-radius-from-city-border: 32
      treasury-reward-per-mob: 25
      # Spawned just outside a city's border, never inside it.
      mob-types: [ZOMBIE, SKELETON, SPIDER, HUSK, STRAY]
      weight: 1.0

    founders-week:
      display-name: Founders' Week
      duration-hours: 168
      claim-cost-percent: 75
      city-creation-free: true
      # A week long, so it should be rare.
      weight: 0.3
      cooldown-hours: 720

    double-upkeep:
      display-name: Double Upkeep
      duration-hours: 24
      upkeep-multiplier: 2.0
      # A rare sink event, announced well in advance.
      announce-hours-before: 48
      weight: 0.4
      cooldown-hours: 336

    tax-holiday:
      display-name: Tax Holiday
      duration-hours: 24
      market-tax-percent: 0
      weight: 1.0

contests:
  enabled: true
  # SPEC 13.4: a 14-day cycle run automatically.
  cycle-days: 14
  # How often the cycle checks whether a phase boundary has passed. Checked far more often
  # than it acts: a phase ends at a wall-clock moment, and the server may have been down when
  # it did, so the check is what notices and catches up.
  check-interval-minutes: 10
  build-days: 11
  voting-days: 2
  max-region-size: 64
  vote-min: 1
  vote-max: 10

  anti-abuse:
    # SPEC 13.4
    block-self-city-votes: true
    low-playtime-hours: 5
    low-playtime-vote-weight: 0.25
    discard-ip-matched-votes: true
    verify-built-during-window: true

  themes:
    - Medieval Market
    - Underground Base
    - Floating Island
    - Grand Library
    - Harbour Town

# SPEC 13.3, the leaderboards.
#
# SPEC 13.3 names the boards and what each ranks, but gives no sizes and no refresh rate, so
# the three numbers below are this implementation's, not the specification's.
leaderboards:
  enabled: true
  # How many entries each board keeps.
  size: 25
  # How many of them print on one page of /leaderboard <type>.
  page-size: 10
  # How often the boards are recomputed. Every board is an aggregate over a whole table or
  # registry, so this is the trade between how fresh the numbers are and how much work the
  # server does for them. It is also how stale a number a player can see: someone who
  # deposits into the treasury does not move up the Contribution board until the next sweep.
  refresh-interval-minutes: 5
  # How often the lifetime Builder and Farmer counters are written out. Small and frequent:
  # this interval is the most work an unclean shutdown can lose.
  stats-flush-seconds: 30
