# Cities, claims, upkeep, members and outposts.
# SPEC.md Section 16.2, plus the rank and upgrade tables from Sections 5.4 and 5.7.

creation:
  cost: 10000
  min-playtime-hours: 2
  name-min-length: 3
  name-max-length: 24
  name-pattern: "^[A-Za-z0-9_]+$"
  blocked-names: [admin, staff, server, console, "null", undefined]
  min-distance-chunks: 5
  # SPEC 17.1 case 7: cooldown applied to a player after any disband.
  disband-cooldown-hours: 24
  rename-cost: 15000

claims:
  starter-flat-count: 8
  starter-flat-cost: 500
  formula-base: 400
  formula-exponent: 1.25
  distance-multiplier-per-chunk: 0.05
  distance-free-radius: 4
  member-divisor-per-member: 0.18
  active-member-days: 14
  new-city-discount: 0.75
  new-city-days: 14
  buffer-chunks: 5
  unclaim-refund-percent: 50
  enforce-contiguity: true
  radius-claim-max: 5
  # Duration of the particle outline shown to the claimer, SPEC 6.3.
  claim-border-particle-seconds: 10
  # Duration of the /city border particle outline, SPEC 6.5.
  border-particle-seconds: 60
  border-particle-radius: 64
  # Any Bukkit Particle name. Both outlines are drawn per-player, so this only
  # changes what the viewer sees.
  border-particle: HAPPY_VILLAGER
  # /city map dimensions, SPEC 6.5.
  map-width: 31
  map-height: 13

upkeep:
  enabled: true
  percent-of-land-value-per-day: 0.4
  charge-hour: 4                 # 04:00 server time
  grace-period-days: 3
  delinquent-auto-unclaim: true
  delinquent-unclaim-per-day: 3  # outermost chunks first
  # SPEC 17.3 case 31: cap on missed cycles charged after downtime.
  max-catchup-cycles: 7
  # Hours between charges. Lower it only for testing; the charge is anchored to
  # charge-hour, so a city is billed once a day whatever this is set to.
  charge-interval-hours: 24
  # How often the sweep looks for cities that have come due. Cheap: a city that is
  # not yet due costs one comparison.
  check-interval-minutes: 10

members:
  base-cap: 10
  switch-cooldown-hours: 24
  invite-expiry-minutes: 5
  # SPEC 5.3: seconds the target has to accept a mayorship transfer.
  transfer-accept-seconds: 60
  # SPEC 8.5 / 17.6 case 71: non-mayor treasury withdrawal cap, and the rolling
  # window it is measured over.
  withdraw-percent-per-day: 25
  withdraw-window-hours: 24

spawn:
  # SPEC 5.6
  warmup-seconds: 5
  warmup-seconds-during-war: 15
  cooldown-seconds: 30

inactivity:
  # SPEC 17.1 cases 1, 2 and 3. Read by InactivityTask, which sweeps on the interval below.
  enabled: true
  check-interval-minutes: 60
  # Case 1: the mayor has not logged in for this long, so the city gets a new one and the old
  # mayor is demoted to the next rank down and told about it when they next log in.
  mayor-transfer-days: 30
  # Case 2: nobody has logged in for this long, so the city's claims stop being protected.
  # Nothing is removed, and any member logging in restores protection immediately.
  dormant-days: 60
  # Case 3: nobody has logged in for this long, so the city is soft-deleted, its land released
  # and its treasury burned.
  soft-delete-days: 120
  # Case 3 on its own switch. It is the most destructive thing this plugin does without a
  # human asking for it: it fires on a timer against cities whose members may simply have been
  # away. Set false to keep succession and dormancy but never delete a city automatically.
  soft-delete-enabled: true
  # The restore window itself is admin.restore-window-days below: it governs
  # /ca city delete just as much as this, and both readers already look there.

# Outposts, SPEC 39.15. This block replaces Part I 16.2's, which priced a single chunk at a
# flat 25,000 C — a design SPEC 39's header retires in full.
#
# SPEC 39.1 explains why: M3a removed the world border, so cities may be a million blocks
# apart, and "a single chunk with a warp pad is no longer a serious answer to the question of
# how a city projects itself across that distance". Outposts became the ONLY mechanism that
# makes remote territory reachable, which promoted them from convenience to primary system.
outposts:
  base-max: 2
  min-distance-from-own-city: 32
  # SPEC 39.6, new with the rework. Outposts grew to four chunks, and six of them is
  # twenty-four remote chunks — without spacing they could be laid end to end into a
  # continuous road, which is the SPEC 6.1 adjacency rule defeated by other means.
  min-distance-from-own-outposts: 24
  min-distance-from-other-city: 8
  delete-refund-percent: 50
  # SPEC 39.2: an outpost is one to four edge-connected chunks.
  max-chunks-per-outpost: 4

  # SPEC 39.3's cost formula, which replaces the flat pricing above. Both are shipped while
  # the SPEC 39 rework is in progress; the Part I keys go when the code reading them does.
  #
  #   cost(n, k, d) = base(n) * D(d) * F(k) / member_divisor
  #     base(n) = claims.formula-base * n^claims.formula-exponent
  #     D(d)    = 1 + distance-constant * sqrt(d / distance-reference-blocks)
  #     F(1)    = founding-surcharge
  #     F(k>1)  = 1 + expansion-escalation * (k - 1)
  #
  # n is the city's chunk count BEFORE this purchase, outposts included. SPEC 39.3 words that
  # ambiguously; SPEC 39.4's published tables settle it, and the other reading overcharges by
  # about 6%.
  #
  # A square root rather than a line or a logarithm, per SPEC 39.3: linear pricing "forbids the
  # frontier outright", and logarithmic pricing means "distance stops mattering past about fifty
  # thousand blocks". This keeps rising forever while each order of magnitude costs less per
  # block than the last.
  cost:
    distance-constant: 0.25
    distance-reference-blocks: 1000
    founding-surcharge: 1.50
    expansion-escalation: 0.25
    apply-member-divisor: true

  # SPEC 39.5. Distance-scaled, so a remote outpost is a permanent commitment rather than a
  # one-off purchase: four chunks at a million blocks costs about 42,700 C a day.
  upkeep:
    base-per-chunk-per-day: 1200
    scales-with-distance: true

  # SPEC 39.5. The fare scales with distance like everything else about an outpost, so
  # base-cost is what D(d) multiplies rather than what a player pays.
  teleport:
    base-cost: 100
    scales-with-distance: true
    warmup-seconds: 8
    cooldown-seconds: 180


# Default ranks created with every new city, SPEC 5.4.
# Permission flag names must match the CityPermission enum.
ranks:
  mayor:
    name: Mayor
    weight: 100
    default: false
    permissions: [ALL]
  co-mayor:
    name: Co-Mayor
    weight: 80
    default: false
    permissions: [ALL_EXCEPT, DISBAND, TRANSFER, MANAGE_RANKS]
  architect:
    name: Architect
    weight: 60
    default: false
    permissions: [BUILD, CONTAINER, INTERACT, CLAIM, SET_SPAWN, OUTPOST_TP, DEPOSIT]
  citizen:
    name: Citizen
    weight: 40
    default: false
    permissions: [BUILD, CONTAINER, INTERACT, OUTPOST_TP, DEPOSIT]
  recruit:
    name: Recruit
    weight: 20
    default: true
    permissions: [CONTAINER_READONLY, INTERACT, DEPOSIT, OUTPOST_TP]

# City upgrades, SPEC 5.7. Costs are per level, L1 to L5.
upgrades:
  population:
    display-name: Population
    effect-per-level: 5          # +5 member cap
    costs: [20000, 50000, 120000, 280000, 600000]
  vault:
    display-name: Vault
    effect-per-level: 1          # +1 vault page of 27 slots
    page-size: 27
    costs: [30000, 70000, 150000, 320000, 700000]
  treasury-interest:
    display-name: Treasury Interest
    effect-per-level: 4.0        # -4% upkeep
    costs: [40000, 90000, 200000, 420000, 900000]
  outpost-range:
    display-name: Outpost Range
    effect-per-level: 1          # +1 max outpost
    max-total: 6
    costs: [60000, 140000, 300000, 650000, 1400000]
  fortification:
    display-name: Fortification
    effect-per-level: 5.0        # +5% defense unit health
    # How many extra units a level allows is configured in defense.yml, under
    # placement.units-per-fortification-level, because placement is defense's business.
    # SPEC 5.7 says +1 and SPEC 12.4 says +2; SPEC 12.4 wins, because its stated range of
    # "5 to 15" is only arithmetic at +2. Keeping the number in one file means the two
    # cannot disagree the way the specification does.
    costs: [50000, 110000, 240000, 500000, 1100000]
  market-access:
    display-name: Market Access
    effect-per-level: 0.8        # -0.8% market tax
    costs: [45000, 100000, 220000, 460000, 1000000]

protection:
  # SPEC 5.5. Villager trading inside claims is a toggle, default allowed.
  allow-villager-trading: true
  # How long to wait before repeating a refusal to the same player, in milliseconds.
  # Holding down left-click inside a claim would otherwise print one line per tick.
  deny-message-cooldown-ms: 2000
  # Blocks protected in addition to the SPEC 5.5 list. Most blocks are classified
  # from Bukkit's own tags, so doors and buttons of any wood are already covered;
  # these lists exist for anything a particular server wants to add or exempt.
  extra-containers: []
  extra-interactables: []
  # Blocks left unprotected even though the rules above would cover them.
  unprotected: []

chat:
  # SPEC 20 decision 6: prefix chat with the city tag via a low-priority handler.
  city-tag-prefix-enabled: true

# The City Hall block, SPEC 8.1.
city-hall:
  material: LODESTONE
  # SPEC 8.1: "cannot be broken by anyone below Co-Mayor", expressed as the rank weight
  # rather than the rank name, because ranks are editable and a city may have renamed it.
  min-break-weight: 80

# City spawn, SPEC 5.6.
spawn:
  warmup-seconds: 5
  cooldown-seconds: 30
  # SPEC 11.6 lengthens the warmup for a city that is at war.
  war-warmup-seconds: 15
  # How far a player may drift before the warmup counts as movement. Small enough that
  # walking cancels it, large enough that standing still on a boat does not.
  warmup-move-tolerance-blocks: 0.5

# Diplomacy, SPEC 14.
diplomacy:
  # SPEC 14.1: the post-war ENEMY marker is cosmetic and decays.
  enemy-marker-days: 30
  # SPEC 14.2: no server-wide mega-blocs, so the political map stays interesting.
  max-allies: 3
  # SPEC 14.2: breaking gives notice, and the alliance holds until it expires. This is what
  # stops a city breaking with an ally the instant it declares war on them.
  break-notice-hours: 24
  re-ally-cooldown-days: 7
  # SPEC 14.3. A truce cannot be cancelled early by either party; that is the point of it.
  truce-min-days: 1
  truce-max-days: 30
  # How often notice periods and truces are checked. The shortest thing measured is a day.
  sweep-interval-minutes: 60

admin:
  # SPEC 5.3 and 9.4.2: how long a soft-deleted city can be brought back with
  # /ca city restore. Also the window SPEC 17.1 case 3 leaves on a city it expires.
  restore-window-days: 14
