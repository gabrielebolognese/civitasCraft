# CivitasCraft, core configuration.
# SPEC.md Section 16.1. Every value in SPEC.md is a config key; nothing is hardcoded.

storage:
  type: SQLITE            # SQLITE or MYSQL
  sqlite:
    # Relative to the plugin data folder.
    file: civitas.db
    # WAL lets readers run while a writer holds the file, which matters because the
    # war block logger writes in large batches. Set to DELETE only if the database
    # lives on a filesystem where WAL is unsafe, such as some network mounts.
    journal-mode: WAL
    pool-size: 4
    busy-timeout-ms: 5000
  mysql:
    host: localhost
    port: 3306
    database: civitas
    username: ""
    password: ""
    pool-size: 10
    # Appended to the JDBC URL. Leave as-is unless you know why you are changing it.
    properties: "useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true"
  # Seconds a database call may take before it is logged as slow. Diagnostic only.
  slow-query-warn-ms: 250
  backup:
    enabled: true
    interval-hours: 6
    keep-count: 28

worlds:
  city-enabled:
    - world
  blacklisted:
    - world_the_end
    - world_nether       # nether claimable is a design choice, off by default


# SPEC 23.4's channel limits. Both exist because a message that cannot be dismissed or that
# fires on every click stops being a message and becomes an interruption.
messages:
  # SPEC 23.4: "Maximum 4 per hour per player, hard-limited in code." A sliding window, so
  # four at 10:59 and four at 11:01 is still refused.
  titles-per-window: 4
  title-window-minutes: 60
  # SPEC 23.5.4's per-player, per-message cooldown on action bar text.
  action-bar-cooldown-ms: 3000

# Active language file under lang/. Falls back to 'en' for any missing key.
language: en

performance:
  # SPEC 16.1. A warning threshold, not a cap: evicting a claim would mean unprotected land,
  # and SPEC 17.7 case 81 puts 50,000 claims at about 2.5 MB, so there is nothing to bound.
  # The server logs once if the cache ever exceeds this.
  claim-cache-size: 100000
  gui-refresh-ticks: 20
  # SPEC 16.1. Not honoured, and the server says so at startup: the ledger is written inside
  # the transaction that moves the money, because SPEC 1.5 makes it the authority for every
  # dispute and a buffered audit row is one a crash loses.
  ledger-batch-size: 200
  ledger-flush-seconds: 5
  # Feeds the average claim lookup and GUI open time in /ca perf (SPEC 9.4.6).
  # Sampled at one call in 64 for the claim lookup, which sits on every block event, so the
  # cost is well under the lookup itself; menu opens are timed every time. Set false to leave
  # the hot path completely untouched, at the price of /ca perf reporting "-" for both.
  timings-enabled: true

# Verbose logging, toggleable in-game with /ca debug <on|off>.
debug: false

# SPEC 15.3's moderation queue.
#
# SPEC specifies no rate limit on /report, and a player-facing command that writes to a
# queue needs one: without it a single player can bury the queue and make the feature
# useless for everybody. These four numbers are this implementation's, not SPEC's, and are
# deliberately generous — nobody with a real complaint should meet them.
moderation:
  reports-per-window: 5
  report-window-hours: 24
  max-reason-length: 200
  queue-size: 25
  # How much of the reported player's history SPEC 15.3 asks to be attached.
  context-entries: 50
  context-days: 30
